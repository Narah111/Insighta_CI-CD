steps: 

#Runing tests before building docker image
- name: 'python:3.11-slim'
  entrypoint: 'bash'
  args:
    #run multiple commands and as string
    - '-c'
    - |
      pip install -r requirements-dev.txt
      python3 -m pytest tests --maxfail=1 --disable-warinings -q

#Building docker image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', gcr.io/$PROJECT_ID/insighta-app:$SHORT_SHA, '.']

#Pushing docker-image to gcr
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/insighta-app:$SHORT_SHA']

#Deploy to cr
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'gcloud'
  args: [
    'run', 'deploy', 'insighta-app',
    '--image', 'gcr.io/$PROJECT_ID/insighta-app:$SHORT_SHA',
    '--region', 'us-central1',
    '--platform', 'managed',
    '--allow-unauthenticated'
  ]

#telling cloud build what to do after build
images:
- 'gcr.io/$PROJECT_ID/insighta-app:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY